<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RescueGrid — Live Command Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">🚑 RescueGrid</div>
    <div class="tagline">AI & GPS Smart Ambulance Priority System</div>
    <div class="conn-status" id="connStatus">● Connecting…</div>
  </header>

  <main>
    <!-- Left panel: stats -->
    <aside class="panel" id="statsPanel">
      <h2>Active Ambulances</h2>
      <div id="ambulanceList" class="card-list"></div>
      <h2 style="margin-top:1.5rem">Junction States</h2>
      <div id="junctionList" class="card-list"></div>
    </aside>

    <!-- Map -->
    <div id="map"></div>
  </main>

  <footer>
    <span>Team RescueGrid</span>
    <span id="lastUpdate">Last update: —</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
